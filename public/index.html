<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mizuki 管理后台</title>
  <style>
    :root { color-scheme: light; --bg:#f3f8ff; --panel:#ffffff; --ink:#17324d; --muted:#647a92; --line:#d7e5f3; --accent:#1976d2; --accent-soft:#e7f2ff; --danger:#c43836; }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    button,input,textarea,select { font:inherit; } button { cursor:pointer; } .hidden { display:none !important; }
    #login { min-height:100vh; display:grid; place-items:center; padding:24px; } .login-card { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:28px; box-shadow:0 16px 42px #00000012; }
    h1,h2,h3,p { margin:0; } h1 { font-size:22px; } h2 { font-size:16px; } .muted { color:var(--muted); } .stack { display:grid; gap:14px; } label { display:grid; gap:6px; font-weight:600; } input,textarea,select { color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:5px; padding:9px 10px; width:100%; } textarea { resize:vertical; min-height:112px; font-family:"JetBrains Mono",ui-monospace,monospace; line-height:1.55; }
    .primary,.secondary,.danger { border:1px solid transparent; border-radius:5px; padding:9px 12px; font-weight:650; } .primary { background:var(--accent); color:#fff; } .secondary { background:transparent; border-color:var(--line); color:var(--ink); } .danger { color:var(--danger); background:transparent; border-color:color-mix(in srgb,var(--danger) 45%,var(--line)); }
    #app { --sidebar-width:272px; display:grid; grid-template-columns:var(--sidebar-width) minmax(0,1fr); min-height:100vh; transition:grid-template-columns .2s ease; } #app > aside { min-width:0; border-right:1px solid var(--line); padding:18px 14px; background:var(--panel); display:grid; grid-template-rows:auto auto 1fr auto; gap:18px; overflow:hidden; } #app.sidebar-collapsed { --sidebar-width:68px; } .brand { display:flex; align-items:center; gap:10px; } .brand-mark { width:30px; height:30px; display:grid; place-items:center; color:#fff; background:var(--accent); border-radius:5px; font-weight:800; } nav { display:grid; gap:4px; } nav button { text-align:left; border:0; border-radius:5px; padding:9px 10px; background:transparent; color:var(--ink); } nav button.active,nav button:hover { background:color-mix(in srgb,var(--accent) 12%,transparent); color:var(--accent); }
    main { min-width:0; padding:28px clamp(20px,3vw,48px); max-width:none; width:100%; margin:0; } .topbar { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:22px; } .view { display:none; } .view.active { display:block; } .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .post-list { display:grid; gap:8px; } .post-row { width:100%; text-align:left; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; padding:13px; display:flex; justify-content:space-between; gap:12px; } .post-row:hover { border-color:var(--accent); } .post-meta { color:var(--muted); font-size:12px; white-space:nowrap; }
    .editor-grid { display:grid; grid-template-columns:minmax(280px,.7fr) minmax(0,1.5fr); gap:18px; align-items:start; } #post-form.editor-grid { grid-template-columns:minmax(620px,1.75fr) minmax(360px,.85fr); } #post-form textarea[name="body"] { min-height:calc(100vh - 280px); } .panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:18px; } .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .full { grid-column:1 / -1; } .check { display:flex; gap:8px; align-items:center; font-weight:500; } .check input { width:auto; } .actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:16px; } .status { min-height:20px; color:var(--muted); } .settings { max-width:760px; display:grid; gap:16px; }

or:var(--accent); color:var(--accent); } .panel { box-shadow:0 8px 24px rgba(37,99,145,.05); } .primary { box-shadow:0 4px 10px rgba(25,118,210,.2); } .brand-mark { background:linear-gradient(145deg,#338fe5,#1766bd); }    button { transition:transform .14s ease, box-shadow .14s ease, background-color .14s ease, border-color .14s ease, opacity .14s ease; } button:hover:not(:disabled) { transform:translateY(-1px); } button:active:not(:disabled) { transform:translateY(1px) scale(.98); box-shadow:none; } button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid #9dcbfa; outline-offset:2px; } button:disabled { cursor:wait; opacity:.64; transform:none; } .primary.is-pending { background:#5b9ee0; } .primary.is-success { background:#188454; } #toast-region { position:fixed; z-index:1000; right:20px; bottom:20px; display:grid; gap:9px; width:min(360px,calc(100vw - 32px)); pointer-events:none; } .toast { background:#fff; color:var(--ink); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:7px; padding:12px 14px; box-shadow:0 14px 34px rgba(31,81,128,.16); display:grid; gap:2px; animation:toast-in .2s ease-out; } .toast.success { border-left-color:#168250; } .toast.error { border-left-color:var(--danger); } .toast strong { font-size:13px; } .toast p { color:var(--muted); font-size:13px; } @keyframes toast-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }    .sidebar-top { display:flex; align-items:center; justify-content:space-between; gap:8px; } .icon-button { width:34px; height:34px; display:grid; place-items:center; flex:0 0 auto; border:1px solid var(--line); background:#fff; color:#276da9; border-radius:5px; font-size:20px; line-height:1; } .icon-button:hover { border-color:var(--accent); background:var(--accent-soft); } .nav-symbol { width:22px; height:22px; display:grid; place-items:center; flex:0 0 auto; font-size:11px; font-weight:800; color:#3975ad; background:#eff7ff; border-radius:4px; } nav button { display:flex; align-items:center; gap:9px; min-height:40px; } .nav-label,.brand-copy { white-space:nowrap; } #app.sidebar-collapsed > aside { padding-inline:12px; } #app.sidebar-collapsed .brand-copy,#app.sidebar-collapsed .nav-label,#app.sidebar-collapsed #logout { display:none; } #app.sidebar-collapsed nav button { justify-content:center; padding-inline:0; } #app.sidebar-collapsed .sidebar-top { justify-content:center; } #app.sidebar-collapsed .icon-button { position:absolute; left:50px; top:18px; width:26px; height:26px; font-size:16px; } @media (max-width:820px) { #app.sidebar-collapsed { --sidebar-width:1fr; } #app.sidebar-collapsed .brand-copy,#app.sidebar-collapsed .nav-label { display:initial; } #app.sidebar-collapsed #logout { display:block; } #app.sidebar-collapsed nav button { justify-content:flex-start; padding-inline:10px; } #app.sidebar-collapsed .icon-button { position:static; width:34px; height:34px; } }    .description-field { grid-column:1 / -1; } .description-field textarea, .data-fields label[data-key="description"] textarea { min-height:176px; line-height:1.65; } .field-hint { color:var(--muted); font-size:12px; font-weight:400; }    .markdown-drop-zone { border:1px dashed transparent; border-radius:7px; padding:4px; transition:border-color .15s ease, background-color .15s ease; } .markdown-drop-zone.is-dragging { border-color:var(--accent); background:var(--accent-soft); } .markdown-drop-zone label { display:grid; gap:6px; } .markdown-import { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; color:var(--muted); font-size:12px; } .markdown-import .secondary { padding:6px 9px; font-size:12px; }    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; } .markdown-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 4px 10px; } .mode-switch { display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; background:#fff; } .mode-switch button { border:0; border-right:1px solid var(--line); border-radius:0; padding:5px 9px; font-size:12px; color:var(--muted); background:transparent; } .mode-switch button:last-child { border-right:0; } .mode-switch button.active { color:#fff; background:var(--accent); } .markdown-workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); min-height:calc(100vh - 350px); border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff; } .markdown-editor-label { display:block; min-width:0; } .markdown-editor-label textarea { display:block; width:100%; height:100%; min-height:calc(100vh - 350px); resize:vertical; border:0; border-radius:0; padding:16px; } .markdown-preview { min-width:0; overflow:auto; border-left:1px solid var(--line); padding:16px 20px; background:#fbfdff; color:var(--ink); line-height:1.75; } .markdown-preview h1,.markdown-preview h2,.markdown-preview h3 { margin:18px 0 9px; line-height:1.3; } .markdown-preview h1 { font-size:25px; } .markdown-preview h2 { font-size:20px; } .markdown-preview h3 { font-size:17px; } .markdown-preview p { margin:0 0 12px; } .markdown-preview ul,.markdown-preview ol { padding-left:22px; margin:0 0 12px; } .markdown-preview blockquote { margin:0 0 12px; padding:8px 12px; border-left:3px solid var(--accent); background:var(--accent-soft); color:#3f668c; } .markdown-preview pre { overflow:auto; padding:13px; border-radius:5px; background:#11263b; color:#e7f2ff; } .markdown-preview code { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.9em; } .markdown-preview :not(pre)>code { padding:2px 4px; border-radius:3px; background:#eaf3fc; color:#125e9f; } .markdown-preview a { color:var(--accent); } .markdown-mode-edit .markdown-workspace { grid-template-columns:1fr; } .markdown-mode-edit .markdown-preview { display:none; } .markdown-mode-preview .markdown-workspace { grid-template-columns:1fr; } .markdown-mode-preview .markdown-editor-label { display:none; } .markdown-mode-preview .markdown-preview { border-left:0; } @media (max-width:980px) { .markdown-workspace { grid-template-columns:1fr; min-height:auto; } .markdown-preview { border-left:0; border-top:1px solid var(--line); min-height:360px; } .markdown-editor-label textarea { min-height:52vh; } }    .image-upload-control { display:flex; align-items:center; gap:8px; margin-top:7px; } .data-fields label[data-key="image"].is-dragging,.data-fields label[data-key="cover"].is-dragging { border-radius:6px; background:var(--accent-soft); outline:2px dashed var(--accent); outline-offset:3px; }    .cover-upload-zone { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:10px; border:1px dashed var(--line); border-radius:6px; color:var(--muted); font-size:12px; } .cover-upload-zone.is-dragging { border-color:var(--accent); background:var(--accent-soft); } .image-thumbnail { display:block; width:min(100%,260px); height:150px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#f7fbff; } .image-thumbnail img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .16s ease; } .image-thumbnail:hover img { transform:scale(1.04); } .image-lightbox { position:fixed; inset:0; z-index:1200; padding:40px; display:grid; place-items:center; background:rgba(12,34,54,.78); } .image-lightbox img { max-width:min(1200px,96vw); max-height:88vh; object-fit:contain; box-shadow:0 20px 60px rgba(0,0,0,.35); } .image-lightbox .icon-button { position:absolute; top:16px; right:16px; background:#fff; } .data-fields .image-thumbnail { margin-top:8px; }    #data { max-width:1560px; } .data-layout { grid-template-columns:224px minmax(0,1fr); gap:20px; align-items:start; } .data-navigation { position:sticky; top:20px; padding:14px; box-shadow:none; } .data-nav-header,.data-commandbar,.data-list-heading,.data-form-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; } .data-nav-header { padding:4px 5px 14px; border-bottom:1px solid var(--line); } .data-eyebrow { display:block; color:#5a8dbc; font-size:10px; font-weight:800; letter-spacing:.11em; margin-bottom:3px; } .data-total { display:grid; place-items:center; width:25px; height:25px; border-radius:50%; color:#226aad; background:var(--accent-soft); font-size:12px; font-weight:700; } .collection-tabs { margin-top:12px; gap:4px; } .collection-tabs button { display:flex; align-items:center; gap:9px; min-height:42px; border-color:transparent; font-weight:650; } .collection-tabs button.active { border-color:#b8d9f7; background:#eaf5ff; color:#1266ae; box-shadow:inset 3px 0 #1976d2; } .collection-icon { display:grid; place-items:center; width:22px; height:22px; border-radius:5px; color:#4b7ca7; background:#f0f7fd; font-size:11px; font-weight:800; } .collection-tabs button.active .collection-icon { color:#fff; background:#1976d2; } .data-nav-note { margin:14px 5px 3px; color:var(--muted); font-size:12px; line-height:1.55; } .data-detail { gap:14px; } .data-commandbar { padding:2px 2px 0; align-items:center; } .data-commandbar h2 { font-size:21px; } .data-workspace { display:grid; grid-template-columns:minmax(260px,.52fr) minmax(0,1.48fr); gap:16px; align-items:start; } .data-list-panel,.data-form-panel { padding:0; overflow:hidden; } .data-list-heading,.data-form-heading { padding:15px 16px 13px; border-bottom:1px solid var(--line); background:#fbfdff; } .data-list-heading h3,.data-form-heading h3 { font-size:14px; } .data-list-heading p,.data-form-heading p { font-size:12px; } .data-list { max-height:calc(100vh - 265px); min-height:440px; padding:8px; gap:6px; background:#fff; } .data-card { border-color:transparent; border-radius:6px; padding:11px 10px; background:#fff; } .data-card:hover { background:#f5faff; border-color:#cce4f9; } .data-card.active { border-color:#b8d9f7; box-shadow:inset 3px 0 #1976d2; background:#eef7ff; } .data-card strong { display:block; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .data-card .post-meta { padding-top:2px; color:#5683aa; } .data-form-panel { min-height:calc(100vh - 240px); } .data-form-panel .data-fields { padding:18px; } .data-form-panel .actions { margin:0; padding:14px 18px; border-top:1px solid var(--line); background:#fbfdff; } .data-form-panel .empty-state { margin:18px; } @media (max-width:1100px) { .data-layout { grid-template-columns:190px minmax(0,1fr); } .data-workspace { grid-template-columns:260px minmax(0,1fr); } } @media (max-width:820px) { .data-layout,.data-workspace { grid-template-columns:1fr; } .data-navigation { position:static; } .collection-tabs { grid-template-columns:repeat(2,minmax(0,1fr)); } .data-list { max-height:320px; min-height:0; } .data-form-panel { min-height:0; } .data-commandbar { align-items:flex-start; flex-direction:column; } }    .experience-fields { display:grid; grid-template-columns:auto minmax(70px,1fr) auto minmax(70px,1fr); align-items:center; gap:7px; } .experience-fields span { color:var(--muted); font-size:12px; } .data-fields label[data-key="url"].is-dragging { border-radius:6px; background:var(--accent-soft); outline:2px dashed var(--accent); outline-offset:3px; }  </style>
</head>
<body>
  <section id="login"><form class="login-card stack" id="login-form"><div class="brand"><span class="brand-mark">M</span><div><h1>Mizuki 管理后台</h1><p class="muted">私有内容工作区</p></div></div><label>密码<input id="password" type="password" autocomplete="current-password" required autofocus></label><button class="primary">登录</button><p id="login-error" class="status" role="alert"></p></form></section>
  <div id="app" class="hidden"><aside><div class="sidebar-top"><div class="brand"><span class="brand-mark">M</span><div class="brand-copy"><h1>Mizuki 管理</h1><p class="muted">静态博客工作区</p></div></div><button class="icon-button" id="sidebar-toggle" type="button" title="收起侧边栏" aria-label="收起侧边栏">&#8249;</button></div><nav><button data-view="posts" class="active"><span class="nav-symbol">文</span><span class="nav-label">文章</span></button><button data-view="data"><span class="nav-symbol">数</span><span class="nav-label">数据中心</span></button><button data-view="settings"><span class="nav-symbol">设</span><span class="nav-label">站点设置</span></button></nav><div></div><button class="secondary" id="logout">退出登录</button></aside>
  <main><div class="topbar"><div><h1 id="page-title">文章</h1><p class="muted">修改内容自动保存到仓库源文件。</p></div><p id="status" class="status" role="status"></p></div>
    <section id="posts" class="view active"><div class="toolbar"><button class="primary" id="new-post">新建文章</button><input id="search" placeholder="搜索文章" aria-label="搜索文章"></div><div id="post-list" class="post-list" style="margin-top:16px"></div></section>
    <section id="editor" class="view"><form id="post-form" class="editor-grid"><div class="panel stack"><label>标题<input name="title" required></label><div id="markdown-drop-zone" class="markdown-drop-zone markdown-mode-split"><div class="markdown-toolbar"><strong>Markdown</strong><div class="mode-switch" role="group" aria-label="Markdown 编辑模式"><button type="button" data-markdown-mode="edit">编辑</button><button type="button" data-markdown-mode="preview">预览</button><button type="button" data-markdown-mode="split" class="active">分屏</button></div></div><div class="markdown-workspace"><label class="markdown-editor-label"><span class="sr-only">Markdown 源码</span><textarea name="body" rows="24"></textarea></label><article id="markdown-preview" class="markdown-preview" aria-label="Markdown 预览"></article></div><div class="markdown-import"><span>拖入 Markdown、WebP 图片或 MP4/WebM 视频</span><div class="media-actions"><button class="secondary" type="button" id="import-markdown">导入 .md</button><button class="secondary" type="button" id="upload-image">上传 WebP</button><button class="secondary" type="button" id="upload-video">上传视频</button></div><input id="markdown-file-input" type="file" accept=".md,text/markdown" class="hidden"><input id="image-file-input" type="file" accept="image/webp,.webp" class="hidden"><input id="video-file-input" type="file" accept="video/mp4,video/webm,.mp4,.webm" class="hidden"></div></div></div><div class="panel stack"><label>文件名<input name="slug" required pattern="[^\\/:*?&quot;&lt;&gt;|]+"></label><div class="fields"><label>发布日期<input name="published" type="date"></label><label>分类<input name="category" list="category-options" placeholder="选择或输入分类"></label><label>标签<input name="tags" class="hidden"><div id="post-tag-picker" class="tag-picker"></div></label></div><label class="description-field">描述<textarea name="description" rows="8" maxlength="600" placeholder="写一段 10-200 字的清晰摘要"></textarea><span class="field-hint">推荐 10-200 字</span></label><label class="cover-field">封面图片<input name="image" readonly placeholder="上传 WebP 封面"></label><div id="cover-upload-zone" class="cover-upload-zone"><span>在此拖放 WebP 封面</span><button class="secondary" type="button" id="upload-cover">上传封面</button><input id="cover-file-input" type="file" accept="image/webp,.webp" class="hidden"></div><a id="cover-thumbnail" class="image-thumbnail hidden" href="#" aria-label="查看完整封面"><img id="cover-preview" alt="文章封面预览"></a><label>系列<input name="series"></label><div class="fields"><label>系列序号<input name="seriesOrder" type="number" min="1"></label><label>状态<select name="status"><option value="">未设置</option><option value="verified">已验证</option><option value="maintenance">维护中</option><option value="outdated">可能已过时</option></select></label></div><label>测试环境<input name="testedOn"></label><label>最后验证<input name="lastVerified" type="date"></label><label class="check"><input name="draft" type="checkbox"> 仅草稿</label><div class="actions"><button class="danger hidden" type="button" id="delete-post">删除</button><button class="secondary" type="button" id="cancel-edit">取消</button><button class="primary">保存文章</button></div></div></form></section>

  <script src="/assets/js/marked.min.js"></script>
  <script>
    const $ = (s) => document.querySelector(s); let currentSlug = null; let posts = [];
    async function api(path, options={}) { const response = await fetch(path, { credentials:"same-origin", headers:{"Content-Type":"application/json", ...(options.headers||{})}, ...options }); if (!response.ok) { const data = await response.json().catch(()=>({})); throw new Error(data.error || "请求失败。"); } return response.status === 204 ? null : response.json(); }
    function setStatus(message, error=false) { const node=$("#status"); node.textContent=message; node.style.color=error ? "var(--danger)" : "var(--muted)"; }
    function openImageLightbox(src, alt="图片预览") { $("#lightbox-image").src=src; $("#lightbox-image").alt=alt; $("#image-lightbox").classList.remove("hidden"); }
    function closeImageLightbox() { $("#image-lightbox").classList.add("hidden"); $("#lightbox-image").src=""; }
    $("#close-lightbox").onclick=closeImageLightbox; $("#image-lightbox").onclick=event=>{if(event.target===$("#image-lightbox")) closeImageLightbox();};
    function showToast(title, message="", tone="success") { const toast=document.createElement("div"); toast.className=`toast ${tone}`; toast.innerHTML=`<strong>${escapeHtml(title)}</strong>${message?`<p>${escapeHtml(message)}</p>`:""}`; $("#toast-region").append(toast); setTimeout(()=>toast.remove(),4200); }
    async function runButtonAction(button, pendingLabel, successLabel, action, completeLabel="已保存") { const original=button.textContent; button.disabled=true; button.classList.add("is-pending"); button.textContent=pendingLabel; try { const result=await action(); button.classList.remove("is-pending"); button.classList.add("is-success"); button.textContent=completeLabel; showToast(successLabel,"修改已写入源文件。"); return result; } finally { setTimeout(()=>{button.disabled=false; button.classList.remove("is-success"); button.textContent=original;},900); } }
    let tagOptions=[]; let techStackOptions=[]; let categoryOptions={projects:[],all:[]};
    const collectionKeys=new Set(["tags","techStack","projects","skills","genre","achievements","certifications"]); const textListKeys=new Set(["focus","learning","building"]);
    async function refreshTagOptions() { [tagOptions,techStackOptions,categoryOptions]=await Promise.all([api("/api/tags"),api("/api/options/tech-stack"),api("/api/options/categories")]); $("#tag-options").innerHTML=[...new Set([...tagOptions,...techStackOptions])].map(tag=>`<option value="${escapeHtml(tag)}"></option>`).join(""); const categories=[...categoryOptions.projects,...categoryOptions.all.filter(item=>!categoryOptions.projects.includes(item))]; $("#category-options").innerHTML=categories.map(category=>`<option value="${escapeHtml(category)}"></option>`).join(""); }
    async function refreshArtistOptions() { const artists=await api("/api/options/artists"); $("#artist-options").innerHTML=artists.map(artist=>`<option value="${escapeHtml(artist)}"></option>`).join(""); }
    function renderPicker(container, values, name, onChange) { const normalized=[...new Set((values||[]).map(value=>String(value).trim()).filter(Boolean))]; const persisted=container.querySelector("input[type=hidden][data-collection]"); container.innerHTML=""; if(persisted) container.append(persisted); container.dataset.values=JSON.stringify(normalized); normalized.forEach(value=>{ const chip=document.createElement("button"); chip.type="button"; chip.className="tag-chip"; chip.textContent=value; const close=document.createElement("span"); close.textContent="×"; chip.append(close); chip.onclick=()=>renderPicker(container,normalized.filter(item=>item!==value),name,onChange); container.append(chip); }); const input=document.createElement("input"); input.className="tag-entry"; input.placeholder=`添加${name}`; input.setAttribute("list","tag-options"); const add=()=>{ const value=input.value.trim(); if(!value) return; const isNew=!normalized.includes(value); renderPicker(container,[...normalized,value],name,onChange); input.value=""; if(isNew) showToast("已添加到集合",value); }; input.onkeydown=event=>{ if(event.key==="Enter"||event.key===",") { event.preventDefault(); add(); } }; input.onblur=add; container.append(input); const suggestions=document.createElement("div"); suggestions.className="tag-suggestions"; (name==="techStack"?techStackOptions:tagOptions).filter(tag=>!normalized.includes(tag)).slice(0,12).forEach(tag=>{ const button=document.createElement("button"); button.type="button"; button.textContent=`+ ${tag}`; button.onclick=()=>renderPicker(container,[...normalized,tag],name,onChange); suggestions.append(button); }); container.append(suggestions); if(onChange) onChange(normalized); }
    function mountPostTags(values=[]) { const source=$("#post-form").elements.tags; const picker=$("#post-tag-picker"); renderPicker(picker,values,"tag",next=>source.value=next.join(",")); }
    function show(view) { document.querySelectorAll(".view").forEach(n=>n.classList.toggle("active",n.id===view)); document.querySelectorAll("nav button").forEach(n=>n.classList.toggle("active",n.dataset.view===view)); $("#page-title").textContent=view==="posts"?"文章":view==="data"?"数据中心":view==="settings"?"站点设置":"编辑文章"; }
    function fill(form, data) { for (const [key,value] of Object.entries(data)) { const field=form.elements[key]; if (!field) continue; if (field.type === "checkbox") field.checked=Boolean(value); else field.value=Array.isArray(value)?value.join(", "):(value||""); } if(form.id==="post-form") { mountPostTags(Array.isArray(data.tags)?data.tags:String(data.tags||"").split(",").filter(Boolean)); refreshArticleCover(); } }
    async function loadPosts() { posts=await api("/api/posts"); renderPosts(); }
    function renderPosts() { const q=$("#search").value.toLowerCase(); const list=$("#post-list"); const filtered=posts.filter(p=>(p.title+p.slug+p.category).toLowerCase().includes(q)); list.innerHTML=filtered.map(p=>`<button class="post-row" data-slug="${encodeURIComponent(p.slug)}"><span><strong>${escapeHtml(p.title)}</strong><br><span class="muted">${escapeHtml(p.category||"未分类")}${p.draft?" · 草稿":""}</span></span><span class="post-meta">${escapeHtml(p.published||"")}</span></button>`).join("") || '<p class="muted">未找到文章。</p>'; list.querySelectorAll("button").forEach(b=>b.onclick=()=>edit(decodeURIComponent(b.dataset.slug))); }
    function escapeHtml(v) { return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
    async function edit(slug) { const data=await api("/api/posts/"+encodeURIComponent(slug)); currentSlug=slug; fill($("#post-form"),data); refreshMarkdownPreview(); $("#delete-post").classList.remove("hidden"); show("editor"); }
    function newPost() { showToast("新建文章", "填写标题和内容后保存即可。"); currentSlug=null; $("#post-form").reset(); mountPostTags([]); refreshMarkdownPreview(); $("#post-form").elements.published.value=new Date().toISOString().slice(0,10); $("#delete-post").classList.add("hidden"); show("editor"); }
    async function boot() { try { await api("/api/session"); } catch { $("#login").classList.remove("hidden"); return; } $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); try { await loadPosts(); await refreshTagOptions(); await refreshArtistOptions(); await loadCollection("projects"); fill($("#settings-form"),await api("/api/settings")); } catch(error) { setStatus(`Data loading failed: ${error.message}`,true); showToast("Data loading failed",error.message,"error"); } }
    $("#login-form").onsubmit=async e=>{e.preventDefault(); try { await api("/api/login",{method:"POST",body:JSON.stringify({password:$("#password").value})}); $("#login-error").textContent=""; boot(); } catch(err) { $("#login-error").textContent=err.message; }};
    const sidebarToggle=$("#sidebar-toggle"); const savedSidebar=localStorage.getItem("mizuki-admin-sidebar")==="collapsed"; $("#app").classList.toggle("sidebar-collapsed",savedSidebar); sidebarToggle.innerHTML=savedSidebar?"&#8250;":"&#8249;"; sidebarToggle.title=savedSidebar?"展开侧边栏":"收起侧边栏"; sidebarToggle.onclick=()=>{ const collapsed=$("#app").classList.toggle("sidebar-collapsed"); localStorage.setItem("mizuki-admin-sidebar",collapsed?"collapsed":"expanded"); sidebarToggle.innerHTML=collapsed?"&#8250;":"&#8249;"; sidebarToggle.title=collapsed?"展开侧边栏":"收起侧边栏"; };
    document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.view)); $("#search").oninput=renderPosts; $("#new-post").onclick=newPost; $("#cancel-edit").onclick=()=>show("posts");
    $("#post-form").onsubmit=async e=>{e.preventDefault(); const data=Object.fromEntries(new FormData(e.currentTarget)); data.draft=e.currentTarget.elements.draft.checked; data.tags=data.tags.split(",").map(x=>x.trim()).filter(Boolean); const button=e.submitter||e.currentTarget.querySelector(".primary"); try { const result=await runButtonAction(button,"保存中...","文章已保存",()=>api(currentSlug?"/api/posts/"+encodeURIComponent(currentSlug):"/api/posts",{method:currentSlug?"PUT":"POST",body:JSON.stringify(data)})); setStatus(result.deployment.status==="triggered"?"已保存，部署已触发。":"已保存到源文件。"); currentSlug=result.slug; await refreshTagOptions(); await loadPosts(); show("posts"); } catch(err) { setStatus(err.message,true); showToast("文章未保存",err.message,"error"); }};
    function addPreviewHeadingAnchors(wrapper) { let index=0; wrapper.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(heading=>{ const base=heading.textContent.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,"-").replace(/^-+|-+$/g,"")||"section"; heading.id=`${base}-${index++}`; }); }
    function refreshMarkdownPreview() { const preview=$("#markdown-preview"); if(!window.marked) { preview.textContent="正在加载 Markdown 预览..."; return; } window.marked.setOptions({ breaks:true, gfm:true }); preview.innerHTML=window.marked.parse($("#post-form").elements.body.value||""); const slug=currentSlug||$("#post-form").elements.slug.value.trim(); if(slug) preview.querySelectorAll("img[src],video[src],video source[src]").forEach(media=>{ const raw=media.getAttribute("src")||""; if(raw.startsWith("./") && raw.includes(".assets/")) { const filename=raw.split("/").pop(); media.setAttribute("src",`/api/posts/${encodeURIComponent(slug)}/assets/${encodeURIComponent(filename)}`); } }); addPreviewHeadingAnchors(preview); if(!preview.innerHTML.trim()) preview.innerHTML='<p class="muted">开始写作即可看到预览。</p>'; }
    $("#post-form").elements.body.addEventListener("input",refreshMarkdownPreview); document.querySelectorAll("[data-markdown-mode]").forEach(button=>button.onclick=()=>{ const mode=button.dataset.markdownMode; markdownDropZone.classList.remove("markdown-mode-edit","markdown-mode-preview","markdown-mode-split"); markdownDropZone.classList.add(`markdown-mode-${mode}`); document.querySelectorAll("[data-markdown-mode]").forEach(item=>item.classList.toggle("active",item===button)); refreshMarkdownPreview(); });
    function parseMarkdownFile(source) { const match=source.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/); if(!match) return { frontmatter:{}, body:source }; const frontmatter={}; match[1].split(/\r?\n/).forEach(line=>{ const index=line.indexOf(":"); if(index<1) return; const key=line.slice(0,index).trim(); let value=line.slice(index+1).trim(); if(value.startsWith("[")&&value.endsWith("]")) value=value.slice(1,-1).split(",").map(item=>item.trim().replace(/^['"]|['"]$/g,"")).filter(Boolean); else { value=value.replace(/^['"]|['"]$/g,""); if(value==="true") value=true; if(value==="false") value=false; } frontmatter[key]=value; }); return {frontmatter,body:match[2]}; }
    async function importMarkdownFile(file) { if(!file||!file.name.toLowerCase().endsWith(".md")) { showToast("导入失败","请选择 .md 文件。","error"); return; } try { const parsed=parseMarkdownFile(await file.text()); const form=$("#post-form"); fill(form,{...parsed.frontmatter,body:parsed.body}); if(parsed.frontmatter.tags) mountPostTags(parsed.frontmatter.tags); if(!form.elements.slug.value) form.elements.slug.value=file.name.replace(/\.md$/i,""); refreshMarkdownPreview(); showToast("Markdown 已导入",`${file.name} 已就绪，可检查后保存。`); } catch(error) { showToast("导入失败",error.message||"无法读取该 Markdown 文件。","error"); } }
    function insertMarkdownAtCursor(markdown) { const body=$("#post-form").elements.body; const start=body.selectionStart; const end=body.selectionEnd; body.value=`${body.value.slice(0,start)}${body.value && start>0 && !body.value.slice(0,start).endsWith("\n") ? "\n\n" : ""}${markdown}\n${body.value.slice(end)}`; body.focus(); body.selectionStart=body.selectionEnd=start+markdown.length+1; refreshMarkdownPreview(); }
    function articleAssetPreviewPath(path) { const slug=currentSlug||$("#post-form").elements.slug.value.trim(); if(!path || !slug || !String(path).includes(".assets/")) return ""; return `/api/posts/${encodeURIComponent(slug)}/assets/${encodeURIComponent(String(path).split("/").pop())}`; }
    function refreshArticleCover() { const path=$("#post-form").elements.image.value; const src=articleAssetPreviewPath(path); const thumb=$("#cover-thumbnail"); if(!src) { thumb.classList.add("hidden"); return; } $("#cover-preview").src=src; thumb.href=src; thumb.classList.remove("hidden"); thumb.onclick=event=>{event.preventDefault(); openImageLightbox(src,"文章封面");}; }
    async function uploadArticleCover(file, button) { const slug=currentSlug||$("#post-form").elements.slug.value.trim(); if(!slug) { showToast("封面上传需要文件名","请先填写文章文件名。","error"); return; } if(!file || file.type!=="image/webp") { showToast("需要 WebP 格式","文章封面必须是 WebP 文件。","error"); return; } try { const data=await new Promise((resolve,reject)=>{const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>reject(new Error("文件无法读取。")); reader.readAsDataURL(file);}); const result=await runButtonAction(button,"上传中...","封面上传成功",()=>api(`/api/posts/${encodeURIComponent(slug)}/assets`,{method:"POST",body:JSON.stringify({name:file.name,data,kind:"image",cover:true,alt:"cover"})})); $("#post-form").elements.image.value=result.path; refreshArticleCover(); showToast("封面路径已添加","保存文章即可发布封面引用。"); } catch(error) { showToast("封面上传失败",error.message||"封面未上传。","error"); } }
    async function uploadPostMedia(file, kind, button) { const slug=currentSlug||$("#post-form").elements.slug.value.trim(); if(!slug) { showToast("上传需要文件名","请先填写文章文件名。","error"); return; } if(kind==="image" && file.type!=="image/webp") { showToast("需要 WebP 格式","图片必须上传为 WebP 文件。","error"); return; } if(kind==="video" && !["video/mp4","video/webm"].includes(file.type)) { showToast("视频格式不支持","视频必须为 MP4 或 WebM 文件。","error"); return; } try { const data=await new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>reject(new Error("文件无法读取。")); reader.readAsDataURL(file); }); const result=await runButtonAction(button,kind==="image"?"上传中...":"上传中...",kind==="image"?"图片已上传":"视频已上传",()=>api(`/api/posts/${encodeURIComponent(slug)}/assets`,{method:"POST",body:JSON.stringify({name:file.name,data,kind,alt:file.name.replace(/\.[^.]+$/,"")})})); insertMarkdownAtCursor(result.markdown); showToast("媒体已插入","媒体路径已添加到 Markdown，保存文章即可发布。"); } catch(error) { showToast("上传失败",error.message||"媒体未上传。","error"); } }
    function handleEditorFile(file) { if(!file) return; if(file.name.toLowerCase().endsWith(".md")) return importMarkdownFile(file); if(file.type==="image/webp") return uploadPostMedia(file,"image",$("#upload-image")); if(["video/mp4","video/webm"].includes(file.type)) return uploadPostMedia(file,"video",$("#upload-video")); showToast("不支持的文件类型","请使用 Markdown、WebP、MP4 或 WebM 文件。","error"); }
    const coverUploadZone=$("#cover-upload-zone"); $("#upload-cover").onclick=()=>$("#cover-file-input").click(); $("#cover-file-input").onchange=event=>uploadArticleCover(event.target.files[0],$("#upload-cover")); ["dragenter","dragover"].forEach(type=>coverUploadZone.addEventListener(type,event=>{event.preventDefault(); coverUploadZone.classList.add("is-dragging");})); ["dragleave","drop"].forEach(type=>coverUploadZone.addEventListener(type,event=>{event.preventDefault(); coverUploadZone.classList.remove("is-dragging");})); coverUploadZone.addEventListener("drop",event=>uploadArticleCover(event.dataTransfer.files[0],$("#upload-cover")));
    const markdownDropZone=$("#markdown-drop-zone"); $("#import-markdown").onclick=()=>$("#markdown-file-input").click(); $("#upload-image").onclick=()=>$("#image-file-input").click(); $("#upload-video").onclick=()=>$("#video-file-input").click(); $("#markdown-file-input").onchange=event=>handleEditorFile(event.target.files[0]); $("#image-file-input").onchange=event=>handleEditorFile(event.target.files[0]); $("#video-file-input").onchange=event=>handleEditorFile(event.target.files[0]); ["dragenter","dragover"].forEach(type=>markdownDropZone.addEventListener(type,event=>{event.preventDefault(); markdownDropZone.classList.add("is-dragging");})); ["dragleave","drop"].forEach(type=>markdownDropZone.addEventListener(type,event=>{event.preventDefault(); markdownDropZone.classList.remove("is-dragging");})); markdownDropZone.addEventListener("drop",event=>handleEditorFile(event.dataTransfer.files[0]));
    $("#delete-post").onclick=async()=>{ if(!currentSlug||!confirm("确定永久删除此文章？")) return; try { await api("/api/posts/"+encodeURIComponent(currentSlug),{method:"DELETE"}); setStatus("文章已删除。"); await loadPosts(); show("posts"); } catch(err) { setStatus(err.message,true); }};
    $("#settings-form").onsubmit=async e=>{e.preventDefault(); const data=Object.fromEntries(new FormData(e.currentTarget)); for(const key of ["bannerEnabled","commentsEnabled","musicEnabled","ogImagesEnabled"]) data[key]=e.currentTarget.elements[key].checked; try { const result=await runButtonAction(e.submitter||e.currentTarget.querySelector(".primary"),"保存中...","设置已保存",()=>api("/api/settings",{method:"PUT",body:JSON.stringify(data)})); setStatus(result.deployment.status==="triggered"?"已保存，部署已触发。":"设置已保存到源文件。"); } catch(err) { setStatus(err.message,true); showToast("设置未保存",err.message,"error"); }};

    const templates = {
      projects: { id:"", title:"", description:"", image:"", category:"web", techStack:[], status:"planned", liveDemo:"", sourceCode:"", visitUrl:"", startDate:"", endDate:"", featured:false, tags:[] },
      skills: { id:"", name:"", description:"", icon:"", category:"frontend", level:"beginner", experience:{years:0,months:0}, projects:[], certifications:[], color:"" },
      timeline: { id:"", title:"", description:"", type:"project", startDate:"", endDate:"", location:"", organization:"", position:"", skills:[], achievements:[], links:[], icon:"", color:"", featured:false },
      anime: { title:"", status:"planned", rating:0, cover:"", description:"", episodes:"", year:"", genre:[], studio:"", link:"", progress:0, totalEpisodes:0, startDate:"", endDate:"" },
      now: { updated:new Date().toISOString().slice(0,10), focus:[], learning:[], building:[], availability:"" },
      music: { id:"", title:"", artist:"", cover:"", url:"", duration:0 }
    };
    function titleFor(item,index) { return item.title || item.name || item.id || `项目 ${index + 1}`; }
    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function inputType(key,value) { if (typeof value === "boolean") return "checkbox"; if (typeof value === "number") return "number"; if (/date$/i.test(key)) return "date"; return "text"; }
    function refreshCollectionImagePreview(field, thumbnail) { if(!field.value) { thumbnail.classList.add("hidden"); return; } thumbnail.querySelector("img").src=field.value; thumbnail.classList.remove("hidden"); if(activeCollection==="music") { thumbnail.removeAttribute("href"); thumbnail.onclick=null; return; } thumbnail.href=field.value; thumbnail.onclick=event=>{event.preventDefault(); openImageLightbox(field.value,"图片预览");}; }
    function readMp3Duration(file) { return new Promise((resolve,reject)=>{ const audio=document.createElement("audio"); const objectUrl=URL.createObjectURL(file); const cleanup=()=>{ URL.revokeObjectURL(objectUrl); audio.removeAttribute("src"); audio.load(); }; audio.preload="metadata"; audio.onloadedmetadata=()=>{ const seconds=Math.round(audio.duration); cleanup(); Number.isFinite(seconds)&&seconds>0 ? resolve(seconds) : reject(new Error("无法读取 MP3 时长。")); }; audio.onerror=()=>{ cleanup(); reject(new Error("无法读取 MP3 时长。")); }; audio.src=objectUrl; }); }
    async function uploadCollectionMedia(file, field, button, thumbnail, mediaField) { const isMusic=activeCollection==="music"; const isAudio=mediaField==="url"; if(!file || (isAudio ? file.type!=="audio/mpeg" : (!isMusic && file.type!=="image/webp"))) { showToast(isAudio?"需要 MP3 格式":"需要 WebP 格式",isAudio?"音乐文件必须为 MP3。":"项目/番剧图片必须为 WebP。","error"); return; } try { const duration=isAudio ? await readMp3Duration(file) : null; const data=await new Promise((resolve,reject)=>{const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>reject(new Error("文件无法读取。")); reader.readAsDataURL(file);}); const result=await runButtonAction(button,"上传中...",isAudio?"音频已上传":"图片已上传",()=>api(`/api/data/${activeCollection}/assets`,{method:"POST",body:JSON.stringify({name:file.name,data,field:mediaField})})); field.value=result.path; if(isAudio) { const edited=collectDataForm(); edited.duration=duration; renderDataFields(edited); } else if(thumbnail) refreshCollectionImagePreview(field,thumbnail); showToast(isAudio?"音频时长已获取":"媒体路径已添加",isAudio?`时长已设为 ${duration} 秒，保存此集合即可发布。`:"保存此集合即可发布新的媒体引用。"); } catch(error) { showToast("上传失败",error.message||"媒体未上传。","error"); } }
    function renderDataFields(item) { const root=$("#data-fields"); root.innerHTML=""; for (const [key,value] of Object.entries(item)) { const label=document.createElement("label"); label.dataset.key=key; const complex=Array.isArray(value)|| (value && typeof value === "object"); label.dataset.wide=key==="description" || complex || String(value||"").length>80 ? "true":"false"; const caption=document.createElement("span"); caption.textContent=key; label.append(caption); let field; if(key==="experience" && activeCollection==="skills") { const group=document.createElement("div"); group.className="experience-fields"; group.innerHTML='<span>年</span><input type="number" min="0" name="experience-years"><span>月</span><input type="number" min="0" max="11" name="experience-months">'; group.querySelector("[name=experience-years]").value=value?.years??0; group.querySelector("[name=experience-months]").value=value?.months??0; field=document.createElement("input"); field.type="hidden"; field.name=key; field.dataset.experience="true"; group.append(field); label.append(group); root.append(label); continue; } if(key==="duration" && activeCollection==="music") { field=document.createElement("input"); field.type="number"; field.name=key; field.readOnly=true; field.value=Number(value||0); label.append(field); const hint=document.createElement("span"); hint.className="field-hint"; hint.textContent="从上传的 MP3 文件自动获取"; label.append(hint); root.append(label); continue; } const isImage=((key==="image"||key==="cover") && ["projects","anime"].includes(activeCollection)) || (key==="cover"&&activeCollection==="music"); if(isImage) { field=document.createElement("input"); field.type="text"; field.name=key; field.readOnly=true; field.value=value||""; label.append(field); const action=document.createElement("div"); action.className="image-upload-control"; const button=document.createElement("button"); button.type="button"; button.className="secondary"; button.textContent=activeCollection==="music"?"上传封面":"上传 WebP"; const picker=document.createElement("input"); picker.type="file"; picker.accept=activeCollection==="music"?"image/*":"image/webp,.webp"; picker.className="hidden"; const thumbnail=document.createElement("a"); thumbnail.className="image-thumbnail hidden"; thumbnail.href="#"; thumbnail.innerHTML='<img alt="已上传图片预览">'; button.onclick=()=>picker.click(); picker.onchange=event=>uploadCollectionMedia(event.target.files[0],field,button,thumbnail,key); action.append(button,picker); label.append(action,thumbnail); refreshCollectionImagePreview(field,thumbnail); ["dragenter","dragover"].forEach(type=>label.addEventListener(type,event=>{event.preventDefault(); label.classList.add("is-dragging");})); ["dragleave","drop"].forEach(type=>label.addEventListener(type,event=>{event.preventDefault(); label.classList.remove("is-dragging");})); label.addEventListener("drop",event=>uploadCollectionMedia(event.dataTransfer.files[0],field,button,thumbnail,key)); root.append(label); continue; } if(key==="url"&&activeCollection==="music") { field=document.createElement("input"); field.type="text"; field.name=key; field.readOnly=true; field.value=value||""; label.append(field); const action=document.createElement("div"); action.className="image-upload-control"; const button=document.createElement("button"); button.type="button"; button.className="secondary"; button.textContent="上传 MP3"; const picker=document.createElement("input"); picker.type="file"; picker.accept="audio/mpeg,.mp3"; picker.className="hidden"; button.onclick=()=>picker.click(); picker.onchange=event=>uploadCollectionMedia(event.target.files[0],field,button,null,key); action.append(button,picker); label.append(action); ["dragenter","dragover"].forEach(type=>label.addEventListener(type,event=>{event.preventDefault(); label.classList.add("is-dragging");})); ["dragleave","drop"].forEach(type=>label.addEventListener(type,event=>{event.preventDefault(); label.classList.remove("is-dragging");})); label.addEventListener("drop",event=>uploadCollectionMedia(event.dataTransfer.files[0],field,button,null,key)); root.append(label); continue; } if(Array.isArray(value)&&textListKeys.has(key)) { field=document.createElement("textarea"); field.rows=6; field.value=value.join("\n"); field.dataset.textList="true"; field.name=key; label.append(field); root.append(label); continue; } if(Array.isArray(value)&&collectionKeys.has(key)) { const picker=document.createElement("div"); picker.className="tag-picker"; picker.dataset.collection="true"; field=document.createElement("input"); field.type="hidden"; field.name=key; field.dataset.collection="true"; picker.append(field); label.append(picker); renderPicker(picker,value,key,next=>field.value=JSON.stringify(next)); root.append(label); continue; } if(complex||key==="description") { field=document.createElement("textarea"); field.rows=key==="description"?8:5; field.value=complex?JSON.stringify(value,null,2):(value??""); if(complex) field.dataset.complex="true"; } else { field=document.createElement("input"); field.type=inputType(key,value); if(field.type==="checkbox") { field.checked=Boolean(value); label.classList.add("check"); label.prepend(field); label.removeChild(caption); label.append(document.createTextNode(key)); } else field.value=value??""; } field.name=key; if(key==="category") field.setAttribute("list","category-options"); if(key==="artist"&&activeCollection==="music") field.setAttribute("list","artist-options"); label.append(field); root.append(label); } }
    function collectDataForm() {
 const original=activeCollection==="now"?collectionItems:collectionItems[activeItem]; const result={}; $("#data-fields").querySelectorAll("[name]").forEach(field=>{ if(field.dataset.experience==="true") { const parent=field.parentElement; result[field.name]={years:Number(parent.querySelector("[name=experience-years]").value||0),months:Number(parent.querySelector("[name=experience-months]").value||0)}; } else if(field.dataset.textList==="true") { result[field.name]=field.value.split(/\r?\n/).map(item=>item.trim()).filter(Boolean); } else if(field.dataset.collection==="true") { result[field.name]=JSON.parse(field.value||"[]"); } else if(field.dataset.complex==="true") { try { result[field.name]=JSON.parse(field.value||"[]"); } catch { throw new Error(`${field.name} 必须是有效的 JSON 格式。`); } } else if(field.type==="checkbox") result[field.name]=field.checked; else if(field.type==="number") result[field.name]=Number(field.value||0); else result[field.name]=field.value; }); return {...original,...result}; }
    function renderDataList() { const list=$("#data-list"); const count=$("#data-item-count"); if(count) count.textContent=activeCollection==="now"?"单条记录":`${collectionItems.length} 项`; if(activeCollection==="now") { list.innerHTML='<div class="empty-state">此刻页面内容为单条站点记录。</div>'; renderDataFields(collectionItems); $("#delete-data-item").classList.add("hidden"); return; } list.innerHTML=collectionItems.map((item,index)=>`<button class="data-card ${index===activeItem?"active":""}" data-index="${index}"><span><strong>${escapeHtml(titleFor(item,index))}</strong><br><span class="muted">${escapeHtml(item.category||item.type||item.status||"")}</span></span><span class="post-meta">${item.featured?"精选":""}</span></button>`).join("") || '<div class="empty-state">暂无数据。创建第一条吧。</div>'; list.querySelectorAll("button").forEach(button=>button.onclick=()=>{activeItem=Number(button.dataset.index); renderDataList(); renderDataFields(collectionItems[activeItem]); $("#delete-data-item").classList.remove("hidden");}); if(activeItem>=0&&collectionItems[activeItem]) renderDataFields(collectionItems[activeItem]); else $("#data-fields").innerHTML='<p class="muted">选择一个项目以编辑其字段。</p>'; }
    async function loadCollection(name) { activeCollection=name; activeItem=-1; const result=await api("/api/data/"+name); collectionItems=result.items; const labels={projects:"项目",skills:"技能",timeline:"时间线",anime:"番剧",now:"此刻",music:"音乐"}; $("#data-workspace-title").textContent=labels[name]||name; $("#data-item-count").textContent=name==="now"?"单条记录":`${collectionItems.length} 项`; document.querySelectorAll("#collection-tabs button").forEach(b=>b.classList.toggle("active",b.dataset.collection===name)); renderDataList(); $("#save-data").disabled=false; }
    $("#collection-tabs").onclick=event=>{ const button=event.target.closest("button[data-collection]"); if(button) loadCollection(button.dataset.collection).catch(err=>setStatus(err.message,true)); };
    $("#new-data-item").onclick=()=>{ if(activeCollection==="now") { collectionItems=clone(templates.now); renderDataList(); return; } showToast("新建项目","已添加一条空白记录到当前集合。"); const item=clone(templates[activeCollection]); collectionItems.push(item); activeItem=collectionItems.length-1; renderDataList(); renderDataFields(item); $("#delete-data-item").classList.remove("hidden"); };
    $("#delete-data-item").onclick=async()=>{ const button=$("#delete-data-item"); if(activeCollection==="now"||activeItem<0||!confirm("确定永久删除此条数据？")) return; try { const result=await runButtonAction(button,"删除中...","项目已删除",async()=>{ collectionItems.splice(activeItem,1); activeItem=-1; return api("/api/data/"+activeCollection,{method:"PUT",body:JSON.stringify({items:collectionItems})}); },"已删除"); if(activeCollection==="projects") await refreshTagOptions(); setStatus(result.deployment.status==="triggered"?"项目已删除，部署已触发。":"项目已删除并保存。"); renderDataList(); } catch(err) { setStatus(err.message,true); showToast("项目未删除",err.message,"error"); await loadCollection(activeCollection); } };
    $("#save-data").onclick=async()=>{ const button=$("#save-data"); try { const edited=collectDataForm(); if(activeCollection==="now") collectionItems=edited; else if(activeItem>=0) collectionItems[activeItem]=edited; const result=await runButtonAction(button,"保存中...","集合已保存",()=>api("/api/data/"+activeCollection,{method:"PUT",body:JSON.stringify({items:collectionItems})})); if(activeCollection==="projects") await refreshTagOptions(); if(activeCollection==="music") await refreshArtistOptions(); setStatus(result.deployment.status==="triggered"?"数据已保存，部署已触发。":"数据已保存到源文件。"); renderDataList(); } catch(err) { setStatus(err.message,true); showToast("集合未保存",err.message,"error"); } };    $("#logout").onclick=async()=>{await api("/api/logout",{method:"POST"}); location.reload();}; boot();
  </script>
  
  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
